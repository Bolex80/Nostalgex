name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upstream clone
        # tests/run.sh checks data/ and the vectors against the commit pinned in
        # data/UPSTREAM. A full clone, not a partial one: run.sh checks the pin
        # out from a --shared clone of this, which can't fetch missing blobs.
        run: git clone --quiet https://github.com/chadMueller/Nostalgex.git "$RUNNER_TEMP/nostalgex"
      - name: Golden vectors (off-device)
        # The interpreter is a first check only; the TV run in
        # scripts/deploy.sh --test is the one that counts.
        env:
          NOSTALGEX_DIR: ${{ runner.temp }}/nostalgex
        run: |
          node --version
          tests/run.sh
