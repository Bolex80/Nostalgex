<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Nostalgex</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="48x48" href="/logo/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script>
  /* Theme boot, runs before first paint so there's no flash on reload. */
  (function () {
    var DEFAULT_THEME = "dark";
    var theme = null;
    try { theme = localStorage.getItem("nostalgex-theme-v2"); } catch (e) {}
    var q = /[?&]theme=(dark|light)/.exec(location.search);
    if (q) theme = q[1];
    if (theme !== "dark" && theme !== "light") theme = DEFAULT_THEME;
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="page-lost">

  <main class="lost">
    <figure class="shot lost-tv" aria-hidden="true">
      <span class="sticker sticker-ch">CH 404</span>
      <div class="lost-static"></div>
    </figure>
    <h1>Channel <span class="grad-word">not found.</span></h1>
    <p class="lost-line">That page got lost between channels.</p>
    <a class="btn btn-ink btn-lg" href="/">Back to home</a>
  </main>

</body>
</html>
